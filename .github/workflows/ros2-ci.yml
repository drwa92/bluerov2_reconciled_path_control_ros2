name: ROS 2 package build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: osrf/ros:jazzy-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          apt-get update
          apt-get install -y python3-colcon-common-extensions python3-pip
          rosdep update || true
          rosdep install --from-paths src --ignore-src -r -y || true
      - name: Build
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          colcon build --packages-select bluerov2_path_interfaces bluerov2_path_control
      - name: Test package discovery
        shell: bash
        run: |
          source /opt/ros/jazzy/setup.bash
          source install/setup.bash
          ros2 pkg list | grep bluerov2_path_control
          ros2 interface list | grep bluerov2_path_interfaces
